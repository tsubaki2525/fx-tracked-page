<title>追跡アカウントの伸び</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef2f7; --line: #dde3ea; --text: #1a2230; --muted: #5f6b7a;
    --accent: #2563eb; --accent-soft: #dbe7ff; --up: #15803d; --down: #dc2626; --bar: #a9c3e6; --bar-strong: #4f86c6;
    --own: #0f766e; --own-soft: #ccfbf1; --shadow: 0 1px 2px rgba(20,30,50,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131b; --panel: #151c27; --panel2: #1c2532; --line: #26303f; --text: #e6ebf2; --muted: #8d99ab;
      --accent: #58a6ff; --accent-soft: #1b2f4d; --up: #3ddc97; --down: #ff6b6b; --bar: #35597f; --bar-strong: #5b8fd0;
      --own: #5eead4; --own-soft: #10322e; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e131b; --panel: #151c27; --panel2: #1c2532; --line: #26303f; --text: #e6ebf2; --muted: #8d99ab;
    --accent: #58a6ff; --accent-soft: #1b2f4d; --up: #3ddc97; --down: #ff6b6b; --bar: #35597f; --bar-strong: #5b8fd0;
    --own: #5eead4; --own-soft: #10322e; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-size: 14px; line-height: 1.55; margin: 0; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 56px; }
  h1, h2 { font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; text-wrap: balance; margin: 0; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: .01em; }
  h2 { font-size: 16px; font-weight: 700; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
  header .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  header .meta b { color: var(--text); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .toolbar .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .seg button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select, input[type="search"] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .rank-box { overflow: auto; max-height: calc(10 * 38px + 32px); }   /* 10行+見出しぶん。以降はスクロール */
  .rank-box thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
  col.c-i { width: 34px; } col.c-n { width: 96px; } col.c-p { width: 80px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  th.r, td.r { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr[aria-selected="true"] { background: var(--accent-soft); }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
  .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .h { color: var(--muted); font-size: 12px; }
  img.av { object-fit: cover; }
  .av { width: 24px; height: 24px; border-radius: 50%; background: var(--panel2); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: 0 0 auto; }
  .up { color: var(--up); font-weight: 500; } .down { color: var(--down); font-weight: 500; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.own { background: var(--own-soft); color: var(--own); border-color: transparent; }
  .badge.genre { background: var(--panel2); }
  .chart { width: 100%; height: 320px; display: block; }
  .chart text { fill: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--bar); } .chart .bar.last { fill: var(--bar-strong); }
  .chart .line { fill: none; stroke: var(--text); stroke-width: 1.6; }
  .chart .dot { fill: var(--panel); stroke: var(--text); stroke-width: 1.4; }
  .chart .dot.last { fill: var(--accent); stroke: var(--accent); }
  .chart .hv { fill: transparent; cursor: crosshair; }
  .chart .hv:hover { fill: var(--accent-soft); opacity: .5; }
  .chart-wrap { position: relative; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; z-index: 2; }
  .tip b { font-family: 'IBM Plex Mono', monospace; }
  .who a { color: inherit; text-decoration: none; }
  .who a:hover .nm, .card a:hover { text-decoration: underline; }
  .card a { color: inherit; text-decoration: none; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 4px 0 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .av { width: 40px; height: 40px; font-size: 16px; }
  .card .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .bio { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .card .spark { width: 100%; height: 36px; display: block; }
  .card .spark path { fill: none; stroke: var(--accent); stroke-width: 1.4; }
  .card .spark .area { fill: var(--accent-soft); stroke: none; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .count { font-size: 12px; color: var(--muted); }
  section { margin-top: 18px; }
  @media (prefers-reduced-motion: no-preference) { tbody tr, .card { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">X アカウント追跡</div>
      <h1>追跡アカウントの伸び</h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="grid2">
    <div class="panel">
      <div class="toolbar">
        <h2>伸びているアカウント</h2>
        <span class="sp"></span>
        <div class="seg" id="seg-period" role="group" aria-label="期間">
          <button data-v="w7" aria-pressed="true">1週間</button><button data-v="d30" aria-pressed="false">1ヶ月</button>
        </div>
        <span class="dim" style="font-size:12px">並び</span>
        <div class="seg" id="seg-sort" role="group" aria-label="並び">
          <button data-v="net" aria-pressed="true">純増</button><button data-v="pct" aria-pressed="false">伸び率</button>
        </div>
      </div>
      <p class="note">その期間で区切って、記録の中のいちばん古い点と新しい点を比べた数字。比べる相手がいない垢と、期間はじめの時点で100人未満の垢の伸び率は「—」。行を押すと右のグラフが切り替わる。</p>
      <div class="rank-box">
        <table>
          <colgroup><col class="c-i"><col><col class="c-n"><col class="c-n"><col class="c-p"></colgroup>
          <thead><tr><th>#</th><th>アカウント</th><th class="r">フォロワー</th><th class="r">純増</th><th class="r">伸び率</th></tr></thead>
          <tbody id="rank"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <h2>アカウント別</h2>
        <span class="sp"></span>
        <select id="sel" aria-label="アカウントを選ぶ"></select>
      </div>
      <div class="toolbar" style="margin-top:0">
        <span class="dim" id="sel-meta" style="font-size:12.5px"></span>
        <span class="sp"></span>
        <div class="seg" id="seg-mode" role="group" aria-label="見方">
          <button data-v="cum" aria-pressed="true">累積</button><button data-v="delta" aria-pressed="false">増減</button>
        </div>
        <div class="seg" id="seg-span" role="group" aria-label="範囲">
          <button data-v="10" aria-pressed="false">10日</button><button data-v="0" aria-pressed="true">全期間</button>
        </div>
      </div>
      <div class="legend"><span><i style="background:var(--text)"></i>フォロワー(左軸)</span><span><i style="background:var(--bar-strong)"></i>インプレッション(右軸)</span></div>
      <div class="chart-wrap">
        <svg class="chart" id="chart" viewBox="0 0 600 320" preserveAspectRatio="none" role="img" aria-label="フォロワーとインプレッションの推移"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>
      <p class="note" style="margin:6px 0 0">点や棒の上に指を置く(マウスを乗せる)と、その日の数字が出る</p>
    </div>
  </div>

  <section>
    <div class="toolbar">
      <h2>追跡中のアカウント</h2>
      <span class="count" id="count"></span>
      <span class="sp"></span>
      <div class="seg" id="seg-genre" role="group" aria-label="ジャンル">
        <button data-v="" aria-pressed="true">全部</button><button data-v="ゴールド" aria-pressed="false">ゴールド</button><button data-v="株" aria-pressed="false">株</button><button data-v="為替" aria-pressed="false">為替</button><button data-v="暗号資産" aria-pressed="false">暗号資産</button>
      </div>
      <input type="search" id="q" placeholder="検索(名前・@垢名・プロフィール)" style="min-width:240px">
    </div>
    <div class="cards" id="cards"></div>
  </section>
</div>

  // ── 伸びランキング ──
  function renderRank() {
    const rows = accs.map((a) => ({ a, g: a.growth && a.growth[S.period] }))
      .filter((r) => r.g && (S.sort === 'pct' ? r.g.伸び率 != null : true))
      .sort((x, y) => (S.sort === 'pct' ? y.g.伸び率 - x.g.伸び率 : y.g.純増 - x.g.純増));
    // 全垢を並べるが、見えるのはトップ10ぶんの高さまで。以降は表の中でスクロール(2026-09-08 本人指示)
    if (!S.sel && rows.length) S.sel = rows[0].a.handle;
    $('#rank').innerHTML = rows.length ? rows.map((r, i) => `
      <tr data-h="${esc(r.a.handle)}" aria-selected="${r.a.handle === S.sel}">
        <td class="num dim">${i + 1}</td>
        <td><div class="who">${avatar(r.a)}<a href="https://x.com/${esc(r.a.handle)}" target="_blank" rel="noreferrer" title="Xで開く" style="min-width:0"><span class="nm">${esc(r.a.name)} <span class="h">@${esc(r.a.handle)}</span></span></a>${r.a.own ? '<span class="badge own">自社</span>' : ''}</div></td>
        <td class="r num">${fmt(r.a.followers)}</td>
        <td class="r num ${cls(r.g.純増)}">${signed(r.g.純増)}</td>
        <td class="r num ${cls(r.g.伸び率 || 0)}">${pct(r.g.伸び率)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty">この期間に比べられる記録がまだありません</td></tr>';
  }
  $('#rank').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;   // 名前のリンクはXを開くだけ(行の選択は変えない)
    const tr = e.target.closest('tr[data-h]'); if (!tr) return;
    S.sel = tr.dataset.h; $('#sel').value = S.sel; renderRank(); renderChart();
  });

  // ── アカウント別グラフ ──
  const sel = $('#sel');
  sel.innerHTML = [...accs].sort((x, y) => y.followers - x.followers)
    .map((a) => `<option value="${esc(a.handle)}">${esc(a.name)}</option>`).join('');
  sel.addEventListener('change', () => { S.sel = sel.value; renderRank(); renderChart(); });

  function renderChart() {
    const a = accs.find((x) => x.handle === S.sel) || accs[0]; if (!a) return;
    sel.value = a.handle;
    $('#sel-meta').textContent = `@${a.handle} ・ 最終収集 ${a.last_scraped || '—'}`;
    const ser = DATA.series[a.handle.toLowerCase()] || { f: [], i: [] };
    // 日付軸: フォロワーとインプレッションの日付を合わせる
    let days = [...new Set([...ser.f.map((p) => p.d), ...ser.i.map((p) => p.d)])].sort();
    if (S.span > 0) days = days.slice(-S.span);
    const fMap = Object.fromEntries(ser.f.map((p) => [p.d, p.v]));
    const iMap = Object.fromEntries(ser.i.map((p) => [p.d, p.v]));
    let fPts, iPts;
    if (S.mode === 'cum') {
      let acc = 0;
      const allDays = [...new Set([...ser.f.map((p) => p.d), ...ser.i.map((p) => p.d)])].sort();
      const cum = {}; for (const d of allDays) { acc += iMap[d] || 0; cum[d] = acc; }
      fPts = days.map((d) => ({ d, v: fMap[d] ?? null })); iPts = days.map((d) => ({ d, v: cum[d] || 0 }));
    } else {
      let prev = null;
      const allDays = [...new Set(ser.f.map((p) => p.d))].sort();
      const delta = {}; for (const d of allDays) { const v = fMap[d]; delta[d] = prev == null ? null : v - prev; prev = v; }
      fPts = days.map((d) => ({ d, v: delta[d] ?? null })); iPts = days.map((d) => ({ d, v: iMap[d] || 0 }));
    }
    const svg = $('#chart'); const W = 600, H = 320, L = 64, R = 56, T = 12, B = 30;
    const iw = W - L - R, ih = H - T - B;
    if (!days.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">記録がまだありません</text>`; return; }
    const fv = fPts.map((p) => p.v).filter((v) => v != null);
    const fMin0 = Math.min(0, ...fv), fMax0 = Math.max(0, ...fv);
    const fLo = S.mode === 'cum' ? Math.min(...fv) * 0.97 : fMin0, fHi = S.mode === 'cum' ? Math.max(...fv) * 1.03 : Math.max(fMax0, 1);
    const iHi = Math.max(1, ...iPts.map((p) => p.v));
    const x = (k) => L + (days.length === 1 ? iw / 2 : k * iw / (days.length - 1));
    const yf = (v) => T + ih - (v - fLo) / ((fHi - fLo) || 1) * ih;
    const yi = (v) => T + ih - v / iHi * ih;
    const bw = Math.max(2, Math.min(18, iw / days.length * 0.6));
    const kfmt = (v) => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k' : String(Math.round(v));
    // 左軸: 幅が狭い(1.1M〜1.2Mのような)時は丸めると同じ表示が並ぶので、実数を出す
    const narrow = (fHi - fLo) < Math.abs(fHi) * 0.2;
    const lfmt = (v) => narrow ? fmt(Math.round(v)) : kfmt(v);
    let out = '';
    for (let g = 0; g <= 4; g++) {
      const y = T + ih * g / 4;
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
      out += `<text x="${L - 6}" y="${y + 4}" text-anchor="end">${lfmt(fHi - (fHi - fLo) * g / 4)}</text>`;
      out += `<text x="${W - R + 6}" y="${y + 4}">${kfmt(iHi * (4 - g) / 4)}</text>`;
    }
    iPts.forEach((p, k) => { if (p.v > 0) out += `<rect class="bar${k === iPts.length - 1 ? ' last' : ''}" x="${x(k) - bw / 2}" y="${yi(p.v)}" width="${bw}" height="${T + ih - yi(p.v)}" rx="1"/>`; });
    const path = fPts.map((p, k) => p.v == null ? null : `${x(k)},${yf(p.v)}`).filter(Boolean);
    if (path.length) out += `<polyline class="line" points="${path.join(' ')}"/>`;
    fPts.forEach((p, k) => { if (p.v != null) out += `<circle class="dot${k === fPts.length - 1 ? ' last' : ''}" cx="${x(k)}" cy="${yf(p.v)}" r="2.6"><title>${p.d} フォロワー ${S.mode === 'cum' ? fmt(p.v) : signed(p.v)} / インプレ ${fmt(iPts[k].v)}</title></circle>`; });
    const colW = days.length === 1 ? iw : iw / (days.length - 1);
    days.forEach((d, k) => {
      const fvv = fPts[k].v, ivv = iPts[k].v;
      const sg = (v) => S.mode === 'delta' ? signed(v) : fmt(v);
      const tip = `<b>${d.slice(5).replace('-', '/')}</b><br>● フォロワー ${fvv == null ? '—' : sg(fvv)}<br>▮ インプレ ${sg(ivv)}`;
      out += `<rect class="hv" x="${x(k) - colW / 2}" y="${T}" width="${colW}" height="${ih}" data-tip="${esc(tip)}"/>`;
    });
    const step = Math.max(1, Math.ceil(days.length / 8));
    days.forEach((d, k) => { if (k % step === 0 || k === days.length - 1) out += `<text x="${x(k)}" y="${H - 10}" text-anchor="middle">${d.slice(5).replace('-', '/')}</text>`; });
    svg.innerHTML = out;
  }

  // ── カード一覧 ──
  function spark(handle) {
    const f = (DATA.series[handle.toLowerCase()] || { f: [] }).f.slice(-30);
    if (f.length < 2) return '';
    const W = 300, H = 36, lo = Math.min(...f.map((p) => p.v)), hi = Math.max(...f.map((p) => p.v));
    const pts = f.map((p, k) => `${k * W / (f.length - 1)},${H - 3 - (p.v - lo) / ((hi - lo) || 1) * (H - 6)}`);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="M0,${H} L${pts.join(' L')} L${W},${H} Z"/><path d="M${pts.join(' L')}"/></svg>`;
  }
  function renderCards() {
    const q = S.q.trim().toLowerCase();
    const list = accs.filter((a) => (!S.genre || (a.genres || []).includes(S.genre)) &&
      (!q || [a.name, a.handle, a.bio].some((s) => String(s || '').toLowerCase().includes(q))));
    $('#count').textContent = `${list.length}垢`;
    $('#cards').innerHTML = list.length ? list.map((a) => `
      <div class="card">
        <div class="top">${avatar(a)}
          <div style="min-width:0;flex:1"><a href="https://x.com/${esc(a.handle)}" target="_blank" rel="noreferrer" title="Xで開く"><div class="nm">${esc(a.name)}</div><div class="dim" style="font-size:12px">@${esc(a.handle)}</div></a></div>
          ${a.own ? '<span class="badge own">自社</span>' : '<span class="badge">競合</span>'}</div>
        <div class="foot">${(a.genres || []).map((g) => `<span class="badge genre">${esc(g)}</span>`).join('')}
          <span>フォロワー <b class="num" style="color:var(--text)">${fmt(a.followers)}</b></span><span>・ 収集 <span class="num">${fmt(a.posts)}</span>件</span></div>
        ${spark(a.handle)}
        <div class="bio">${esc(a.bio)}</div>
        <div class="foot"><span class="badge" style="${a.daily ? 'color:var(--up)' : 'color:var(--down)'}">${a.daily ? '毎日収集' : '更新停止'}</span><span>最終収集 ${a.last_scraped || '—'}</span>
          ${a.growth && a.growth.w7 ? `<span style="margin-left:auto">7日 <b class="num ${cls(a.growth.w7.純増)}">${signed(a.growth.w7.純増)}</b></span>` : ''}</div>
      </div>`).join('') : '<div class="empty">該当するアカウントがありません</div>';
  }
  $('#q').addEventListener('input', (e) => { S.q = e.target.value; renderCards(); });

  (() => {
    const svg = $('#chart'), tip = $('#tip'), wrap = svg.parentElement;
    const show = (e) => {
      const t = e.target.closest('.hv'); if (!t) { tip.hidden = true; return; }
      tip.innerHTML = t.dataset.tip; tip.hidden = false;
      const r = wrap.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const flip = px > r.width * 0.6;
      tip.style.left = flip ? 'auto' : (px + 12) + 'px'; tip.style.right = flip ? (r.width - px + 12) + 'px' : 'auto';
      tip.style.top = Math.max(0, py - 40) + 'px';
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => { tip.hidden = true; });
  })();
  seg('#seg-period', 'period', () => { renderRank(); });
  seg('#seg-sort', 'sort', () => { renderRank(); });
  seg('#seg-mode', 'mode', renderChart);
  seg('#seg-span', 'span', () => { S.span = Number(S.span); renderChart(); });
  seg('#seg-genre', 'genre', renderCards);
  renderRank(); renderChart(); renderCards();
})();
</script>
